services:
  frontend:
    build:
      context: ../..
      dockerfile: docker/combined/Dockerfile
      target: frontend
      args:
        NEXT_PUBLIC_API_URL_PROD: ${NEXT_PUBLIC_API_URL_PROD:-http://localhost:5000/api/v1}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:5000}
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    build:
      context: ../..
      dockerfile: docker/combined/Dockerfile
      target: server
    command: ["sh", "-c", "npx prisma migrate deploy && npm start"]
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce}@database:5432/${POSTGRES_DB:-b2c_ecommerce}
      REDIS_URL: redis://redis:6379
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_local_placeholder}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-google-client}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-local-google-secret}
      GOOGLE_CALLBACK_URL_PROD: ${GOOGLE_CALLBACK_URL_PROD:-http://localhost:3000/api/v1/auth/google/callback}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-local-facebook-app}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-local-facebook-secret}
      FACEBOOK_CALLBACK_URL_PROD: ${FACEBOOK_CALLBACK_URL_PROD:-http://localhost:3000/api/v1/auth/facebook/callback}
      TWITTER_CONSUMER_KEY: ${TWITTER_CONSUMER_KEY:-local-twitter-key}
      TWITTER_CONSUMER_SECRET: ${TWITTER_CONSUMER_SECRET:-local-twitter-secret}
      TWITTER_CALLBACK_URL_PROD: ${TWITTER_CALLBACK_URL_PROD:-http://localhost:3000/api/v1/auth/twitter/callback}
    ports:
      - "${SERVER_PORT:-5000}:5000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:5000/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  database:
    build:
      context: ../../src/database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
      POSTGRES_DB: ${POSTGRES_DB:-b2c_ecommerce}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: